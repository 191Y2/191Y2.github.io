name: Keep wisp server awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping wisp server
        run: |
          curl -sS -m 30 -o /dev/null -w "wisp ping: HTTP %{http_code} in %{time_total}s\n" https://wisp-yrxl.onrender.com/ || true
